name: Build Electron Releases

# Push a version tag (e.g. v1.2.0) to build the desktop apps and publish them as a release.
# The release notes come from .github/release-notes/<tag>.md
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: electron-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Don't publish desktop builds of a commit that fails lint or the conversion tests
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check release notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "::error::Missing release notes: $notes"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Check linting
        run: bun run lint

      - name: Check formatting
        run: bun run fmt:check

      - name: Check prebuilts
        run: bun run build:check

      - name: Build
        run: bun run build

      - name: Generate cache
        run: bun run cache:build

      - name: Test
        run: bun test ./test/

  build-electron:
    needs: test
    runs-on: ${{ matrix.os }}

    env:
      VITE_COMMIT_SHA: ${{ github.sha }}

    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: win
          - os: macos-15
            platform: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Check prebuilts
        run: bun run build:check

      - name: Set version
        shell: bash
        run: bun pm pkg set version=${GITHUB_REF_NAME#v}

      - name: Build Distribution for ${{ matrix.platform }}
        run: bun run desktop:dist:${{ matrix.platform }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  # Publish only once every platform built, so a release is never missing an app
  publish:
    needs: build-electron
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Gorin ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: release/*
